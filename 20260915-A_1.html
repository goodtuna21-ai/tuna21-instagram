<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>참치21 홍보 이미지 - 진짜 참치 한 상</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1a1410; }
  body {
    font-family: "Noto Sans CJK KR", "Noto Sans KR", "NanumGothic", sans-serif;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .card {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 35%;
  }
  .shade-bottom {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 34%, rgba(0,0,0,0.55) 66%, rgba(0,0,0,0.88) 100%);
  }
  .content {
    position: relative;
    z-index: 2;
    margin-top: auto;
    padding: 0 76px 92px;
    color: #fff;
  }
  .kicker {
    display: inline-block;
    background: rgba(199,58,43,0.9);
    color: #fff;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 10px 24px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .headline {
    font-size: 72px;
    font-weight: 900;
    line-height: 1.34;
    margin-bottom: 30px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.45);
  }
  .sub {
    font-size: 34px;
    font-weight: 500;
    line-height: 1.6;
    color: #f2e9df;
    margin-bottom: 8px;
  }
  .info-box {
    margin-top: 40px;
    background: rgba(255,255,255,0.14);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 22px;
    padding: 30px 36px;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.7;
    backdrop-filter: blur(2px);
  }
  .info-box .phone { font-size: 38px; font-weight: 900; color: #ffd9b8; }
  .brand-tag {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    z-index: 3;
  }
</style>
</head>
<body>

<div class="card" id="cardA">
  <div class="bg" style="background-image:url('../../../photos/참치21_점심정식 (1).jpg');"></div>
  <div class="shade-bottom"></div>
  <div class="content">
    <div class="kicker">참치21 · 강남역</div>
    <div class="headline">강남역에서<br>즐기는 진짜<br>참치 한 상</div>
    <div class="sub">점심정식 참치회·초밥·튀김,<br>알밥·콘치즈와 함께</div>
    <div class="info-box">
      🚗 주차 가능 · ☎️ 예약 문의<br><span class="phone">02-556-0067</span>
    </div>
  </div>
  <div class="brand-tag">참치21 · @tuna21_gangnam</div>
</div>

</body>
</html>
